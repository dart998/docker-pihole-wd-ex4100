version: "2.4"

services:
  pihole:
    image: ovelayos/pihole-wd-ex4100:2026.07.2-ex4100-r4
    container_name: pihole-ex4100
    hostname: pihole-ex4100
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
      - "8443:443/tcp"

    environment:
      TZ: Europe/Andorra
      FTLCONF_webserver_api_password: CAMBIA_ESTA_PASSWORD
      FTLCONF_dns_listeningMode: ALL

    volumes:
      - /shares/Volume_1/docker/pihole-ex4100/etc-pihole:/etc/pihole
      - /shares/Volume_1/docker/pihole-ex4100/etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
      - CHOWN

    security_opt:
      - seccomp:unconfined

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

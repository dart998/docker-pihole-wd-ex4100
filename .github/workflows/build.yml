name: Build EX4100 image

on:
  workflow_dispatch:
    inputs:
      pihole_tag:
        description: Upstream pi-hole/docker-pi-hole tag
        required: true
        default: "2026.07.2"
      revision:
        description: EX4100 compatibility revision
        required: true
        default: "r4"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare patched upstream source
        run: |
          chmod +x scripts/prepare-source.sh
          scripts/prepare-source.sh "${{ inputs.pihole_tag }}" .build

      - name: Build and push ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .build/src
          file: .build/src/Dockerfile
          platforms: linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: |
            ovelayos/pihole-wd-ex4100:${{ inputs.pihole_tag }}-ex4100-${{ inputs.revision }}
            ovelayos/pihole-wd-ex4100:latest-ex4100-armv7
            ovelayos/pihole-wd-ex4100:legacy-armv7

name: Build EX4100 image

on:
  workflow_dispatch:
    inputs:
      pihole_tag:
        description: Official pi-hole/docker-pi-hole tag; leave empty for latest stable
        required: false
        default: ""
      revision:
        description: EX4100 compatibility revision
        required: true
        default: "r4"
      force:
        description: Rebuild even when the repository tag already exists
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "build-and-push.ps1"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: ex4100-upstream-release
  cancel-in-progress: false

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      LOCAL_IMAGE: pihole-wd-ex4100:test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve official Pi-hole release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PIHOLE_TAG: ${{ github.event.inputs.pihole_tag || '' }}
          INPUT_REVISION: ${{ github.event.inputs.revision || 'r4' }}
          FORCE_BUILD: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          PIHOLE_TAG="$INPUT_PIHOLE_TAG"
          if [ -z "$PIHOLE_TAG" ]; then
            PIHOLE_TAG="$(
              curl -fsSL --retry 3 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/pi-hole/docker-pi-hole/releases/latest \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])'
            )"
          fi

          if ! [[ "$PIHOLE_TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Unsupported upstream tag: $PIHOLE_TAG" >&2
            exit 1
          fi

          if ! [[ "$INPUT_REVISION" =~ ^r[0-9]+$ ]]; then
            echo "Unsupported compatibility revision: $INPUT_REVISION" >&2
            exit 1
          fi

          git ls-remote --exit-code --refs \
            https://github.com/pi-hole/docker-pi-hole.git \
            "refs/tags/${PIHOLE_TAG}" >/dev/null

          REPO_TAG="${PIHOLE_TAG}-ex4100-${INPUT_REVISION}"
          RELEASE_IMAGE="ovelayos/pihole-wd-ex4100:${REPO_TAG}"

          git fetch --tags --force
          SKIP_BUILD=false
          if git rev-parse -q --verify "refs/tags/${REPO_TAG}^{commit}" >/dev/null \
            && [ "$FORCE_BUILD" != "true" ]; then
            SKIP_BUILD=true
          fi

          echo "pihole_tag=$PIHOLE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$INPUT_REVISION" >> "$GITHUB_OUTPUT"
          echo "repo_tag=$REPO_TAG" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP_BUILD" >> "$GITHUB_OUTPUT"

          echo "PIHOLE_TAG=$PIHOLE_TAG" >> "$GITHUB_ENV"
          echo "REVISION=$INPUT_REVISION" >> "$GITHUB_ENV"
          echo "REPO_TAG=$REPO_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=$RELEASE_IMAGE" >> "$GITHUB_ENV"

          if [ "$SKIP_BUILD" = "true" ]; then
            echo "Repository tag ${REPO_TAG} already exists; nothing to build."
          else
            echo "Preparing ${PIHOLE_TAG} as ${REPO_TAG}."
          fi

      - name: Set up QEMU
        if: steps.release.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Set up Docker Buildx
        if: steps.release.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Prepare and validate patched upstream source
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-source.sh
          scripts/prepare-source.sh "$PIHOLE_TAG" .build

          DOCKERFILE=.build/src/Dockerfile
          test -f "$DOCKERFILE"
          grep -n -F 'FROM alpine:3.17.10 AS base' "$DOCKERFILE"
          grep -n -E '^[[:space:]]+procps[[:space:]]*\\$' "$DOCKERFILE"
          if grep -n -F 'procps-ng' "$DOCKERFILE"; then exit 1; fi
          grep -n -F 'WD EX4100 compatibility: normalize shell scripts to LF' "$DOCKERFILE"
          grep -n -F 'ENTRYPOINT ["start.sh"]' "$DOCKERFILE"

      - name: Build ARMv7 image locally
        if: steps.release.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .build/src
          file: .build/src/Dockerfile
          platforms: linux/arm/v7
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            PIHOLE_DOCKER_TAG=${{ env.PIHOLE_TAG }}
            CORE_BRANCH=master
            WEB_BRANCH=master
            FTL_BRANCH=master
            PADD_BRANCH=master

      - name: Smoke test image
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE" --format '{{.Architecture}}' | grep -q '^arm$'
          docker run --rm --platform linux/arm/v7 --entrypoint /bin/sh "$LOCAL_IMAGE" -c '
            set -eu
            test "$(head -n 1 /usr/bin/start.sh)" = "#!/bin/bash"
            ! grep -RIl $'"'"'\r'"'"' /usr/bin /usr/local/bin /opt/pihole 2>/dev/null | grep -q .
            pihole-FTL -vv
          '

      - name: Log in to Docker Hub
        if: steps.release.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push validated image
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$RELEASE_IMAGE"
          docker tag "$LOCAL_IMAGE" ovelayos/pihole-wd-ex4100:latest-ex4100-armv7
          docker tag "$LOCAL_IMAGE" ovelayos/pihole-wd-ex4100:legacy-armv7
          docker push "$RELEASE_IMAGE"
          docker push ovelayos/pihole-wd-ex4100:latest-ex4100-armv7
          docker push ovelayos/pihole-wd-ex4100:legacy-armv7

      - name: Promote validated image in stable stack
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 scripts/update-stable-version.py "$REPO_TAG" "$PIHOLE_TAG"
          git diff --check

          grep -F "image: \${PIHOLE_IMAGE:-${RELEASE_IMAGE}}" compose/portainer-stack.yml
          grep -Fx "PIHOLE_IMAGE=${RELEASE_IMAGE}" .env.example

          if git diff --quiet; then
            echo "Stable references already point to ${RELEASE_IMAGE}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add compose/portainer-stack.yml .env.example README.md
            git commit -m "Promote Pi-hole ${PIHOLE_TAG} EX4100 image"
            git push origin HEAD:main
          fi

      - name: Create repository tag
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${REPO_TAG}^{commit}" >/dev/null; then
            echo "Repository tag ${REPO_TAG} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$REPO_TAG" -m "Pi-hole ${PIHOLE_TAG} for WD EX4100 (${REVISION})"
          git push origin "refs/tags/${REPO_TAG}"
